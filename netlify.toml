# CuántoVale.es - Netlify Deployment & Proxy Configuration

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyD6-GdZ9lo-6VWlHfMMHzL8OIgOdd6nPkI"
  SECRETS_SCAN_OMIT_KEYS = "apiKey,VITE_FIREBASE_API_KEY"

# 1. API Admin Proxy Rewrite (Priority 1)
[[redirects]]
  from = "/api/admin/*"
  to = "https://ais-pre-ith2aypbi7deopcakmk6so-921734783716.europe-west2.run.app/api/admin/:splat"
  status = 200
  force = true
  headers = { X-From = "Netlify-Proxy" }

# 2. General API Proxy Rewrite
[[redirects]]
  from = "/api/*"
  to = "https://ais-pre-ith2aypbi7deopcakmk6so-921734783716.europe-west2.run.app/api/:splat"
  status = 200
  force = true
  headers = { X-From = "Netlify-Proxy" }

# 3. Admin Console Routing (Served directly from dist/admin/index.html on Netlify)
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# 5. Catch-all SSR proxy rewrite to Cloud Run Express backend (placed LAST)
[[redirects]]
  from = "/*"
  to = "https://ais-pre-ith2aypbi7deopcakmk6so-921734783716.europe-west2.run.app/:splat"
  status = 200

# Global Public Indexing & Security Headers for Netlify CDN
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow, max-snippet:-1, max-image-preview:large"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Explicit Content-Type Headers
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

# Strict Disallow on Admin & API Routes
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/api*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
